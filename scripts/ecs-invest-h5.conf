server {
    listen 80;
    server_name 47.92.235.34;

    root /opt/invest/h5;
    index index.html;

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到本机 invest 后端，并注入鉴权头（演示部署：LAN token 服务器侧持有）
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer c9ac9181fb367657a0e702382a691af07047dee509090151";
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }
}
