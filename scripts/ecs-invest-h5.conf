# invest ECS nginx 统一入口（S11 会员化拓扑，2026-11-08）
#
# 公网 http://47.92.235.34/ 全同源：
#   /                    → PC 投研管理台（invest-web SPA）
#   /h5/                 → 移动端 H5（uni-app，账密登录）
#   /api/invest/**       → 本机 invest-app（star JWT 鉴权）
#   /api/auth|member|family|reminder/** → frps vhost(:8080) → Mac star 网关 → 会员/提醒服务
#
# 登录限流：/api/auth/ 每 IP 10 次/分钟（burst 10），超出 429（S11 AC-6）

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name 47.92.235.34;

    # ---- PC 投研管理台（SPA history 路由） ----
    root /opt/invest/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 移动端 H5（/h5/ 前缀部署） ----
    location /h5/ {
        alias /opt/invest/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    # ---- invest 业务 API（本机 FastAPI，star JWT 鉴权） ----
    location /api/invest/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    # ---- star 会员/家庭/提醒 API：frps vhost(:8080) 按 Host 路由到 Mac 网关 ----
    location ~ ^/api/(auth|member|family|reminder)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 47.92.235.34;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }
}
