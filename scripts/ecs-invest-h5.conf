# invest ECS nginx server block 模板（2026-11-08 安全整改）
# 变更：不再注入 Authorization——公网 API 必须持 token（客户端在设置页/登录页输入）
# 上传限制 5m 与后端 OCR 一致（nginx 默认 1m 会先于后端拦截）
server {
    listen 80;
    server_name 47.92.235.34;

    root /opt/invest/h5;
    index index.html;

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到本机 invest 后端（鉴权由客户端携带 Bearer token）
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }
}
