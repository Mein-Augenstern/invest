# S11 Cloudflare 入口镜像路由（监听 127.0.0.1:8081，专供 cloudflared 隧道）
#
# 与 :80 主 server 同构，但 Host 固定回写为白名单值（隧道域名随机，不能进 HostCheck）。
# CORS 去重：Mac 网关与下游服务会各加一次 Access-Control-Allow-Origin（重复头
# 浏览器视为非法 → fetch 必败，2026-11-08 实证）——在代理层统一收敛为单头。
# （本机其他 conf 已用 map 指令会触发 map_hash_bucket_size 冲突，改用 if+set）

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /opt/invest/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /h5/ {
        alias /opt/invest/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    location /api/invest/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host 47.92.235.34;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    location ~ ^/api/(auth|member|family|reminder)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 47.92.235.34;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        # CORS 收敛：隐藏上游全部 CORS 头，按白名单 origin 回写单份
        set $cors_origin "";
        if ($http_origin ~ ^https://invest-[a-z0-9]+\.pages\.dev$) {
            set $cors_origin $http_origin;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }
}
