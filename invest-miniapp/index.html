<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title>invest</title>
    <style>
      /* PC 宽屏适配（≥768px）：手机 UI 限宽 420px 居中成"手机列"，
         两侧暗色；transform 使页面内 fixed 元素（fab/弹窗）以列包含块定位。
         手机端（<768px）完全不受影响。 */
      @media screen and (min-width: 768px) {
        /* 浅色桌面：与暗色手机列强对比，一眼区分"手机屏"与"桌面" */
        html, body { background: #e9ebef !important; }
        uni-app, uni-page, uni-page-wrapper, uni-page-body {
          max-width: 420px !important;
          margin-left: auto !important;
          margin-right: auto !important;
        }
        /* 手机机身：白底 + 阴影 + 顶部圆角（手机屏浮在桌面） */
        uni-app {
          background: #fff !important;
          box-shadow: 0 16px 60px rgba(0, 0, 0, .22), 0 0 0 1px rgba(0, 0, 0, .08) !important;
          min-height: 100vh !important;
          border-radius: 18px 18px 0 0 !important;
        }
        uni-page-wrapper { transform: translateZ(0); }
        uni-tabbar, .uni-tabbar {
          max-width: 420px !important;
          left: 0 !important;
          right: 0 !important;
          margin: 0 auto !important;
          transform: translateX(0) !important;
        }
        uni-tabbar .uni-tabbar, .uni-tabbar__bd {
          max-width: 420px !important;
          margin: 0 auto !important;
        }
        uni-page-head .uni-page-head {
          max-width: 420px !important;
          margin: 0 auto !important;
        }
      }
    </style>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
