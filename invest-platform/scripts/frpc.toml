# invest 公网隧道 v2（架构归位）：公网 8080 → star 网关容器（网关再转发 /api/invest/**）
# 变更（G2 收口二阶段）：vhost 后端从 invest --lan:8792 改为 star-platform-gateway:8080——
#   小程序统一走 star 架构（wx-login 微信登录 → star JWT → 网关路由 invest），
#   direct 直连模式退役为备用（仅链路排障用）。
# 踩坑存档（v1 时期，勿回退）：
# 1. localIP 用容器名（docker_default 网络容器对容器直连）——--network host 的
#    127.0.0.1 是 Docker VM 回环、host.docker.internal 是桥接间接层
# 2. hostHeaderRewrite 仅 invest 后端需要（其 Host 白名单）——网关不校验 Host，无需
# 3. frpc 镜像 0.64.0 与 ECS frps 严格同版（跨版本 work 连接 EOF）
# token 由 frpc-up.sh 从 .env.dev 的 INVEST_FRP_TOKEN 渲染注入（不入库）
serverAddr = "47.92.235.34"
serverPort = 7000
auth.token = "{$INVEST_FRP_TOKEN}"

loginFailExit = false
transport.heartbeatInterval = 30
transport.heartbeatTimeout = 90
transport.tcpMux = true

[[proxies]]
name = "star-gateway-vhost"
type = "http"
localIP = "star-platform-gateway"
localPort = 8080
customDomains = ["47.92.235.34"]
