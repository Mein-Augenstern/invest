[project]
name = "invest"
version = "0.6.0"
description = "个人投研与决策支持平台（决策支持，非自动交易）"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pandas>=2.0",
    "pyjwt>=2.15.1",
    # macOS Vision 本地 OCR（S2 拍照识别）——仅 darwin 安装：Linux 容器里构建失败
    # （找 /usr/bin/sw_vers）且运行期 import 走惰性加载 + 平台 fallback，容器形态自然降级
    "pyobjc-framework-vision>=12.2.2; sys_platform == 'darwin'",
    "pymysql>=1.1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "requests>=2.31",
    "uvicorn>=0.52.4",
]

[project.scripts]
invest = "invest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
