<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}invest · 个人投资管理平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ 'vendor/tabler/tabler.min.css'|asset }}">
  <link rel="stylesheet" href="{{ 'css/app.css'|asset }}">
  <script>
    // 明暗模式：记住选择，默认跟随系统（在首屏绘制前应用避免闪烁）
    (function () {
      var t = localStorage.getItem("invest-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <h1 class="navbar-brand navbar-brand-autodark">invest<span class="text-secondary ms-2" style="font-size:.7em">决策支持 · 不自动交易</span></h1>
        <div class="navbar-nav flex-row d-lg-none ms-auto"></div>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3">
            {% for path, label, icon in nav %}
            <li class="nav-item">
              <a class="nav-link {{ 'active' if path == active_path else '' }}" href="{{ path }}">
                <span class="nav-link-icon d-md-none d-lg-inline-block">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ icon }}"/></svg>
                </span>
                <span class="nav-link-title">{{ label }}</span>
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </aside>
    <div class="page-wrapper">
      <header class="navbar navbar-expand-md d-none d-lg-flex">
        <div class="container-xl">
          <div class="navbar-nav flex-row order-md-last align-items-center">
            <div class="nav-item">
              <button type="button" class="btn btn-link nav-link px-0" id="theme-toggle" title="明/暗切换">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </header>
      <div class="page-body">
        <div class="container-xl">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", cur);
      localStorage.setItem("invest-theme", cur);
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
