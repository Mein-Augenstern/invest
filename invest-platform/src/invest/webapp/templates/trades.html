{% extends "base.html" %}
{% block title %}流水 · invest{% endblock %}
{% block content %}
<div class="card mb-3 viz-scope">
  <div class="card-header"><h3 class="card-title" id="sum-title">当前状态</h3></div>
  <div class="card-body"><div class="tiles" id="summary"></div></div>
</div>

<div class="card mb-3">
  <div class="card-header"><h3 class="card-title">新增流水</h3></div>
  <div class="card-body">
    <form id="form" class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="f-ins">标的</label>
        <select id="f-ins" class="form-select" required></select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-action">动作</label>
        <select id="f-action" class="form-select">
          <option value="contribute">缴存（养老金账户入金，不占基金）</option>
          <option value="buy">申购（用账户资金买基金）</option>
          <option value="sell">赎回（卖出）</option>
          <option value="dividend_cash">现金分红</option>
          <option value="dividend_reinvest">红利再投资</option>
          <option value="adjust">份额校准（对账差异，可负）</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-date">日期</label>
        <input id="f-date" type="date" class="form-control" required>
      </div>
      <div class="col-md-4" id="f-mode-box">
        <label class="form-label">录入方式</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="mode" id="mode-amount" value="amount" checked>
          <label class="btn" for="mode-amount">按金额</label>
          <input type="radio" class="btn-check" name="mode" id="mode-qty" value="qty">
          <label class="btn" for="mode-qty">按份额</label>
        </div>
      </div>
      <div class="col-md-4" id="f-amount-box">
        <label class="form-label" for="f-amount">金额（元）</label>
        <input id="f-amount" type="number" step="0.01" min="0" class="form-control" placeholder="12000">
      </div>
      <div class="col-md-4" id="f-qty-box">
        <label class="form-label" for="f-qty" id="f-qty-label">份额</label>
        <input id="f-qty" type="number" step="0.01" min="0" class="form-control" placeholder="10000">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-price" id="f-price-label">成交净值</label>
        <input id="f-price" type="number" step="0.0001" min="0" class="form-control" required placeholder="1.0215">
        <div class="form-hint" id="price-hint"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-fee">费用（可空）</label>
        <input id="f-fee" type="number" step="0.01" min="0" class="form-control" placeholder="0">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-note">备注（可空）</label>
        <input id="f-note" type="text" class="form-control" placeholder="如：养老金年度缴存">
      </div>
      <div class="col-12">
        <button class="btn btn-primary" id="submit" type="submit">保存流水</button>
        <span id="msg"></span>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3 class="card-title">历史流水（最近40条）</h3></div>
  <div class="table-responsive"><table class="table table-vcenter card-table" id="trades-table"></table></div>
</div>
{% endblock %}
{% block scripts %}
<script>window.STATE0 = {{ state | tojson }};</script>
<script src="{{ 'js/trades.js'|asset }}"></script>
{% endblock %}
