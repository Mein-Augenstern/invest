version: 2
updates:
  # invest-platform 依赖（akshare/fastapi/pymysql 等）——周更批处理
  - package-ecosystem: "pip"
    directory: "/invest-platform"
    schedule:
      interval: "weekly"
    groups:
      python-minor:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
